[package]
name = "erlcuda_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "erlcuda_nif"
crate-type = ["cdylib", "rlib"]

# `bench` gates bench_pure_cuda ([[bin]] below) so it isn't built (and thus
# never copied into priv/native/) by default `cargo build`/`mix compile`.
# Run the benchmark with:
#   cargo run --release --features bench --bin bench_pure_cuda
[features]
bench = []

[dependencies]
rustler = "0.38"
cust = { git = "https://github.com/Rust-GPU/rust-cuda", rev = "6a836d9236fc38e0fa7a71f7bdeda7a8f82bc8d5" }
cust_raw = { git = "https://github.com/Rust-GPU/rust-cuda", rev = "6a836d9236fc38e0fa7a71f7bdeda7a8f82bc8d5", default-features = false, features = ["driver"] }

[build-dependencies]
cuda_builder = { git = "https://github.com/Rust-GPU/rust-cuda", rev = "6a836d9236fc38e0fa7a71f7bdeda7a8f82bc8d5", default-features = false }

[[bin]]
name = "bench_pure_cuda"
path = "src/bin/bench_pure_cuda.rs"
required-features = ["bench"]
